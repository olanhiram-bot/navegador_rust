[workspace]
resolver = "3"
members = [
    "crates/descriptor",
    "crates/engine",
    "crates/engine-cdp",
    "crates/receipt",
    "crates/card",
    "crates/session",
    "crates/mcp",
    "crates/navegador",
    "crates/shell",
    "crates/shell-gpui",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

# La decodificación JPEG es el trabajo por frame más caro de la shell. Sin
# esto, en `dev` tarda ~150 ms por frame y la navegación se siente rota.
[profile.dev.package.image]
opt-level = 3

[profile.dev.package.zune-jpeg]
opt-level = 3

[profile.dev.package.base64]
opt-level = 3

[workspace.dependencies]
anyhow = "1"
base64 = "0.22"
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
ed25519-dalek = { version = "3", features = ["signature"] }
futures-util = "0.3"
hex = "0.4"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
signature = "3"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time", "net", "sync", "io-util"] }
tokio-tungstenite = "0.30"
url = "2"

# GPUI 0.2.2 arrastra xattr 0.2.3, que usa libc::ENOATTR en Linux (donde el
# atributo se llama ENODATA). Se parchea una copia mínima; quitar cuando GPUI
# actualice su árbol de dependencias.
[patch.crates-io]
xattr = { path = "vendor/xattr" }
