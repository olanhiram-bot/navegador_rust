[workspace]
resolver = "3"
members = ["crates/descriptor", "crates/engine-cdp", "crates/navegador"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
anyhow = "1"
futures-util = "0.3"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time", "net", "sync", "io-util"] }
tokio-tungstenite = "0.30"
url = "2"
