name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: browser-actions/setup-chrome@v1
      - name: Apuntar al Chromium instalado
        run: echo "NAVEGADOR_CHROME=$(which google-chrome)" >> "$GITHUB_ENV"
      - name: Tests (incluye el arnés de ataques)
        run: cargo test --workspace --all-targets

  gui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Dependencias de ventana (egui/glow)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev \
            libxrandr-dev libxi-dev libgl1-mesa-dev
      - name: Compilar la tarjeta nativa
        run: |
          cargo check -p card --features gui
          cargo check -p navegador --features gui
          cargo check -p shell --all-targets
