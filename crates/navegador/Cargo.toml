[package]
name = "navegador"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
gui = ["card/gui"]

[dependencies]
anyhow.workspace = true
card = { path = "../card" }
descriptor = { path = "../descriptor" }
engine-cdp = { path = "../engine-cdp" }
receipt = { path = "../receipt" }
serde_json.workspace = true
tokio.workspace = true
url.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "process", "time", "net", "sync", "io-util"] }
